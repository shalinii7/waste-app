<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Smart Waste Classifier</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#EDE7F6 0%,#E3D7FF 45%,#D8CFFF 100%);
    padding:20px;position:relative;overflow:hidden;
  }
  .float{position:absolute;font-size:42px;opacity:0.55;animation:floaty 6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.12));z-index:1}
  .f1{top:8%;left:8%}.f2{top:14%;right:10%;font-size:48px;animation-delay:1s}
  .f3{bottom:16%;left:10%;font-size:46px;animation-delay:.5s}.f4{bottom:12%;right:12%;animation-delay:1.5s}
  .f5{top:48%;left:4%;font-size:38px;animation-delay:2s}.f6{top:52%;right:4%;font-size:40px;animation-delay:.8s}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}

  /* Bubbles - one BIG one! */
  .bubble{
    position:absolute;border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:1.5px solid rgba(255,255,255,0.55);
    box-shadow:inset 0 0 14px rgba(255,255,255,0.6);
    animation:bubbleMove linear infinite;z-index:1;pointer-events:none;
  }
  .b1{width:18px;height:18px;left:18%;top:80%;animation-duration:11s}
  .b2{width:32px;height:32px;left:68%;top:85%;animation-duration:14s;animation-delay:2s}
  .b3{width:12px;height:12px;left:42%;top:90%;animation-duration:9s;animation-delay:1s}
  /* BIG bubble */
  .b4{width:85px;height:85px;left:80%;top:70%;animation-duration:18s;animation-delay:1s;background:rgba(255,255,255,0.10)}
  .b5{width:22px;height:22px;left:8%;top:70%;animation-duration:12s;animation-delay:1.5s}
  .b6{width:14px;height:14px;left:55%;top:88%;animation-duration:10s;animation-delay:.5s}
  .b7{width:64px;height:64px;left:12%;top:18%;animation-duration:16s;animation-delay:2.5s;background:rgba(255,255,255,0.12)}
  @keyframes bubbleMove{
    0%{transform:translate(0,0) scale(1);opacity:0}
    10%{opacity:0.9}
    50%{transform:translate(28px,-180px) scale(1.08)}
    90%{opacity:0.7}
    100%{transform:translate(-18px,-420px) scale(1.15);opacity:0}
  }

  .card{
    position:relative;z-index:2;background:#fff;width:100%;max-width:420px;
    padding:36px 32px 26px;border-radius:24px;
    box-shadow:0 18px 40px rgba(124,93,211,0.20);
    animation:pop .6s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .logo{font-size:46px;text-align:center;margin-bottom:6px}
  h2{text-align:center;font-size:27px;color:#5B3FBF;margin-bottom:6px}
  .sub{text-align:center;color:#7a7a9a;font-size:14px;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:600;color:#444;margin:15px 0 7px}
  input{
    width:100%;padding:13px 15px;border:1.5px solid #E0D9FF;
    border-radius:13px;font-size:15px;outline:none;transition:.2s;background:#F8F6FF;
  }
  input:focus{border-color:#8B6FE8;background:#fff;box-shadow:0 0 0 4px rgba(139,111,232,.18)}
  button{
    width:100%;margin-top:26px;padding:14px;border:none;border-radius:13px;
    background:linear-gradient(135deg,#8B6FE8,#B28DFF);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;transition:.2s;
    box-shadow:0 10px 22px rgba(139,111,232,.35);
  }
  button:hover{transform:translateY(-2px)}
  .link{text-align:center;margin-top:20px;font-size:14px;color:#7a7a9a}
  .link a{color:#7C5CD6;font-weight:700;text-decoration:none}
  #msg{text-align:center;margin-top:14px;font-size:14px;min-height:20px}
  .ok{color:#198754}.err{color:#dc3545}

  /* TINY PANDA - just a little bigger than "Password" word */
  .pwd-row{display:flex;align-items:center;gap:8px;margin:15px 0 7px}
  .pwd-row label{margin:0}
  .panda{
    width:34px;height:30px;background:#fff;border:2px solid #222;border-radius:50%;
    position:relative;flex-shrink:0;transition:0.25s;
  }
  .panda::before,.panda::after{
    content:'';position:absolute;width:10px;height:10px;background:#222;
    border-radius:50%;top:-5px;
  }
  .panda::before{left:1px}.panda::after
