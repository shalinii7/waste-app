<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Smart Waste Classifier</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#EDE7F6 0%,#E3D7FF 45%,#D8CFFF 100%);padding:20px;position:relative}
  .float{position:absolute;font-size:42px;opacity:0.55;animation:floaty 6s ease-in-out infinite;z-index:1}
  .f1{top:8%;left:8%}.f2{top:14%;right:10%;font-size:48px;animation-delay:1s}
  .f3{bottom:16%;left:10%;font-size:46px;animation-delay:.5s}.f4{bottom:12%;right:12%;animation-delay:1.5s}
  .f5{top:48%;left:4%;font-size:38px;animation-delay:2s}.f6{top:52%;right:4%;font-size:40px;animation-delay:.8s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.55);animation:bubbleMove linear infinite;z-index:1;pointer-events:none}
  .b1{width:18px;height:18px;left:18%;top:80%;animation-duration:11s}
  .b2{width:32px;height:32px;left:68%;top:85%;animation-duration:14s;animation-delay:2s}
  .b3{width:12px;height:12px;left:42%;top:90%;animation-duration:9s;animation-delay:1s}
  .b4{width:85px;height:85px;left:80%;top:70%;animation-duration:18s;animation-delay:1s;background:rgba(255,255,255,0.10)}
  .b5{width:22px;height:22px;left:8%;top:70%;animation-duration:12s;animation-delay:1.5s}
  .b6{width:14px;height:14px;left:55%;top:88%;animation-duration:10s;animation-delay:.5s}
  .b7{width:64px;height:64px;left:12%;top:18%;animation-duration:16s;animation-delay:2.5s}
  @keyframes bubbleMove{0%{transform:translate(0,0);opacity:0}10%{opacity:0.9}100%{transform:translate(-10px,-380px);opacity:0}}
  .card{position:relative;z-index:2;background:#fff;width:100%;max-width:420px;padding:36px 32px 26px;border-radius:24px;box-shadow:0 18px 40px rgba(124,93,211,0.20);opacity:1 !important}
  .logo{font-size:46px;text-align:center;margin-bottom:6px}
  h2{text-align:center;font-size:27px;color:#5B3FBF;margin-bottom:6px}
  .sub{text-align:center;color:#7a7a9a;font-size:14px;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:600;color:#444;margin:15px 0 7px}
  input{width:100%;padding:13px 15px;border:1.5px solid #E0D9FF;border-radius:13px;font-size:15px;outline:none;background:#F8F6FF}
  input:focus{border-color:#8B6FE8;background:#fff;box-shadow:0 0 0 4px rgba(139,111,232,.18)}
  button{width:100%;margin-top:26px;padding:14px;border:none;border-radius:13px;background:linear-gradient(135deg,#8B6FE8,#B28DFF);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 10px 22px rgba(139,111,232,.35)}
  button:hover{transform:translateY(-2px)}
  .link{text-align:center;margin-top:20px;font-size:14px;color:#7a7a9a}
  .link a{color:#7C5CD6;font-weight:700;text-decoration:none}
  #msg{text-align:center;margin-top:14px;font-size:14px;min-height:20px}
  .ok{color:#198754}.err{color:#dc3545}

  /* PERFECT LYING PANDA - Exactly like reference */
  .pwd-row{display:flex;align-items:center;gap:10px;margin:15px 0 7px}
  .pwd-row label{margin:0}
  .panda-hint{font-size:11px;color:#8B6FE8;font-weight:600}
  .panda-lie{width:88px;height:44px;position:relative;flex-shrink:0}
  /* Ears - on top of head */
  .p-ear{position:absolute;width:18px;height:18px;background:#1a1a1a;border-radius:50%;top:0;z-index:1}
  .p-ear.left{left:3px}.p-ear.right{left:30px}
  /* Tuft - ONE tiny white bump, NO black border, NO horns! */
  .tuft{position:absolute;top:-4px;left:22px;width:9px;height:8px;background:#fff;border-radius:50% 50% 50% 50% / 100% 100% 0 0;z-index:3}
  /* Head - front */
  .p-head{position:absolute;left:0;top:4px;width:50px;height:40px;background:#fff;border:2px solid #1a1a1a;border-radius:50%;z-index:3;overflow:hidden}
  .patch{position:absolute;width:17px;height:21px;background:#1a1a1a;border-radius:50%;top:10px}
  .patch.left{left:3px;transform:rotate(-12deg)}
  .patch.right{right:3px;transform:rotate(12deg)}
  .p-eye{position:absolute;width:7px;height:8px;background:#1a1a1a;border-radius:50%;top:6px;left:5px}
  .shine{position:absolute;width:2.5px;height:2.5px;background:#fff;border-radius:50%;top:1px;left:1px}
  .closed{position:absolute;top:14px;width:10px;height:6px;border-bottom:2.5px solid #1a1a1a;border-radius:0 0 10px 10px;display:none}
  .closed.left{left:6px}.closed.right{right:6px}
  .cheek{position:absolute;width:11px;height:8px;background:#FFC9C9;border-radius:50%;top:23px}
  .cheek.left{left:0}.cheek.right{right:0}
  .p-nose{position:absolute;left:50%;top:23px;transform:translateX(-50%);width:5px;height:4px;background:#1a1a1a;border-radius:50%;z-index:2}
  .p-mouth{position:absolute;left:50%;top:27px;transform:translateX(-50%);width:9px;height:4px;border-bottom:1.5px solid #1a1a1a;border-radius:0 0 8px 8px}

  /* BACK / BODY - CONNECTED to head! Same floor line! */
  .p-body{
    position:absolute;left:38px;top:14px;width:48px;height:30px;
    background:#fff;border:2px solid #1a1a1a;border-radius:50%;
    z-index:1;
  }
  /* Black back leg / foot - INSIDE body at bottom-right, NOT a tail! */
  .p-foot{
    position:absolute;right:4px;bottom:-1px;width:22px;height:14px;
    background:#1a1a1a;border-radius:50%;z-index:2;
  }
  /* Small black hump on top of back - like reference */
  .p-hump{position:absolute;left:48px;top:10px;width:16px;height:10px;background:#1a1a1a;border-radius:50%;z-index:1}

  /* Paws - ALWAYS visible, white border! */
  .p-paw{position:absolute;bottom:0;width:14px;height:19px;background:#1a1a1a;border-radius:10px;z-index:5;transition:0.3s;border:1.5px solid #fff;box-shadow:0 0 0 1px #1a1a1a}
  .p-paw.left{left:7px;transform:rotate(-8deg)}.p-paw.right{left:28px;transform:rotate(8deg)}
  .panda-lie.sleep .p-paw.left{bottom:10px;left:5px;opacity:1}
  .panda-lie.sleep .p-paw.right{bottom:10px;left:29px;opacity:1}
  .panda-lie.sleep .p-eye{display:none}
  .panda-lie.sleep .closed{display:block}
  .zzz{position:absolute;top:-2px;right:-10px;font-size:11px;opacity:0}
  .panda-lie.sleep .zzz{opacity:1}
</style>
</head>
<body>
  <span class="float f1">📦</span><span class="float f2">🫙</span>
  <span class="float f3">🔩</span><span class="float f4">🌱</span>
  <span class="float f5">📰</span><span class="float f6">🧴</span>
  <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
  <span class="bubble b4"></span><span class="bubble b5"></span><span class="bubble b6"></span>
  <span class="bubble b7"></span>
<div class="card">
  <div class="logo">♻️</div>
  <h2>Create Account</h2>
  <p class="sub">Join Smart Waste Classifier</p>
  <label>Username</label>
  <input id="username" placeholder="Choose username - e.g. user1 or your_name">
  <label>Email</label>
  <input id="email" type="email" placeholder="Enter email">
  <div class="pwd-row">
    <label for="password">Password</label>
    <div class="panda-lie" id="panda">
      <div class="p-ear left"></div><div class="p-ear right"></div>
      <div class="tuft"></div>
      <!-- BACK first (behind head) -->
      <div class="p-hump"></div>
      <div class="p-body"><div class="p-foot"></div></div>
      <!-- HEAD front -->
      <div class="p-head">
        <div class="patch left"><div class="p-eye"><div class="shine"></div></div></div>
        <div class="patch right"><div class="p-eye"><div class="shine"></div></div></div>
        <div class="closed left"></div><div class="closed right"></div>
        <div class="cheek left"></div><div class="cheek right"></div>
        <div class="p-nose"></div><div class="p-mouth"></div>
      </div>
      <div class="p-paw left"></div><div class="p-paw right"></div>
      <div class="zzz">💤</div>
    </div>
    <span class="panda-hint" id="pandaText">I'm watching 👀</span>
  </div>
  <input id="password" type="password" placeholder="Choose password">
  <button id="btn" onclick="register()">Create Account →</button>
  <p id="msg"></p>
  <p class="link">Already have account? <a href="login.html">Login</a></p>
</div>
<script>
const API = "https://waste-app-m0ez.onrender.com";
const pwd = document.getElementById('password');
const panda = document.getElementById('panda');
const pandaText = document.getElementById('pandaText');
pwd.addEventListener('focus', ()=>{ panda.classList.add('sleep'); pandaText.textContent="Shhh... sleeping! 💤"; });
pwd.addEventListener('blur', ()=>{ panda.classList.remove('sleep'); pandaText.textContent="I'm watching 👀"; });
pwd.addEventListener('input', ()=>{ if(pwd.value.length>0){ panda.classList.add('sleep'); pandaText.textContent="Secret! Don't peek! 🤫"; } });
async function register(){
  const btn=document.getElementById('btn');const msg=document.getElementById('msg');
  const username=document.getElementById('username').value.trim();
  const email=document.getElementById('email').value.trim();const password=pwd.value;
  if(!username||!email||!password){msg.textContent="Please fill all fields";msg.className="err";return;}
  btn.disabled=true;btn.textContent="Creating...";msg.textContent="";
  try{
    const res=await fetch(API+"/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,email,password})});
    const data=await res.json();
    if(res.ok){msg.textContent="Account created! Go to Login...";msg.className="ok";setTimeout(()=>window.location.href="login.html",1200);}
    else{msg.textContent=data.error||"Failed to register";msg.className="err";}
  }catch(e){msg.textContent="Backend not running. Please try again.";msg.className="err";}
  btn.disabled=false;btn.textContent="Create Account →";
}
</script>
</body>
</html>
