<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Smart Waste Classifier</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#EDE7F6 0%,#E3D7FF 45%,#D8CFFF 100%);
    padding:20px;position:relative;overflow:hidden;
  }
  /* Floating waste emojis */
  .float{
    position:absolute;font-size:42px;opacity:0.55;
    animation:floaty 6s ease-in-out infinite;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.12));
  }
  .f1{top:8%;left:8%;animation-delay:0s}
  .f2{top:14%;right:10%;font-size:48px;animation-delay:1s}
  .f3{bottom:16%;left:10%;font-size:46px;animation-delay:0.5s}
  .f4{bottom:12%;right:12%;animation-delay:1.5s}
  .f5{top:48%;left:4%;font-size:38px;animation-delay:2s}
  .f6{top:52%;right:4%;font-size:40px;animation-delay:0.8s}
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-16px) rotate(4deg)}
  }
  .card{
    position:relative;z-index:2;background:#ffffff;width:100%;max-width:420px;
    padding:36px 32px 26px;border-radius:24px;
    box-shadow:0 18px 40px rgba(124,93,211,0.20);
    animation:pop 0.6s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .logo{font-size:46px;text-align:center;margin-bottom:6px;animation:floaty 4s ease-in-out infinite}
  h2{text-align:center;font-size:27px;color:#5B3FBF;margin-bottom:6px}
  .sub{text-align:center;color:#7a7a9a;font-size:14px;margin-bottom:24px}
  label{display:block;font-size:13px;font-weight:600;color:#444;margin:15px 0 7px}
  input{
    width:100%;padding:13px 15px;border:1.5px solid #E0D9FF;
    border-radius:13px;font-size:15px;outline:none;transition:0.2s;background:#F8F6FF;
  }
  input:focus{border-color:#8B6FE8;background:#fff;box-shadow:0 0 0 4px rgba(139,111,232,0.18)}
  button{
    width:100%;margin-top:26px;padding:14px;border:none;border-radius:13px;
    background:linear-gradient(135deg,#8B6FE8,#B28DFF);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;transition:0.2s;
    box-shadow:0 10px 22px rgba(139,111,232,0.35);
  }
  button:hover{transform:translateY(-2px)}
  button:disabled{opacity:0.7;transform:none}
  .link{text-align:center;margin-top:20px;font-size:14px;color:#7a7a9a}
  .link a{color:#7C5CD6;font-weight:700;text-decoration:none}
  #msg{text-align:center;margin-top:14px;font-size:14px;min-height:20px}
  .ok{color:#198754}.err{color:#dc3545}
</style>
</head>
<body>
  <span class="float f1">📦</span>
  <span class="float f2">🫙</span>
  <span class="float f3">🔩</span>
  <span class="float f4">🌱</span>
  <span class="float f5">📰</span>
  <span class="float f6">🧴</span>

<div class="card">
  <div class="logo">♻️</div>
  <h2>Create Account</h2>
  <p class="sub">Join Smart Waste Classifier</p>

  <label>Username</label>
  <input id="username" placeholder="Choose username - e.g. user1 or your_name">

  <label>Email</label>
  <input id="email" type="email" placeholder="Enter email">

  <label>Password</label>
  <input id="password" type="password" placeholder="Choose password">

  <button id="btn" onclick="register()">Create Account →</button>
  <p id="msg"></p>
  <p class="link">Already have account? <a href="login.html">Login</a></p>
</div>

<script>
const API = "https://waste-app-m0ez.onrender.com";
async function register(){
  const btn=document.getElementById('btn');
  const msg=document.getElementById('msg');
  const username=document.getElementById('username').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!username||!email||!password){msg.textContent="Please fill all fields";msg.className="err";return;}
  btn.disabled=true;btn.textContent="Creating...";msg.textContent="";
  try{
    const res=await fetch(API+"/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,email,password})});
    const data=await res.json();
    if(res.ok){msg.textContent="Account created! Go to Login...";msg.className="ok";setTimeout(()=>window.location.href="login.html",1200);}
    else{msg.textContent=data.error||"Failed to register";msg.className="err";}
  }catch(e){msg.textContent="Backend not running. Please try again.";msg.className="err";}
  btn.disabled=false;btn.textContent="Create Account →";
}
</script>
</body>
</html>
