<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - Smart Waste Classifier</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#EDE7F6 0%,#E3D7FF 45%,#D8CFFF 100%);
    padding:20px;position:relative;overflow:hidden;
  }
  .float{position:absolute;font-size:42px;opacity:0.55;animation:floaty 6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.12));z-index:1}
  .f1{top:8%;left:8%}.f2{top:14%;right:10%;font-size:48px;animation-delay:1s}
  .f3{bottom:16%;left:10%;font-size:46px;animation-delay:.5s}.f4{bottom:12%;right:12%;animation-delay:1.5s}
  .f5{top:48%;left:4%;font-size:38px;animation-delay:2s}.f6{top:52%;right:4%;font-size:40px;animation-delay:.8s}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}

  /* Bubbles - one BIG one! */
  .bubble{
    position:absolute;border-radius:50%;
    background:rgba(255,255,255,0.15);
    border:1.5px solid rgba(255,255,255,0.55);
    box-shadow:inset 0 0 14px rgba(255,255,255,0.6);
    animation:bubbleMove linear infinite;z-index:1;pointer-events:none;
  }
  .b1{width:18px;height:18px;left:18%;top:80%;animation-duration:11s}
  .b2{width:32px;height:32px;left:68%;top:85%;animation-duration:14s;animation-delay:2s}
  .b3{width:12px;height:12px;left:42%;top:90%;animation-duration:9s;animation-delay:1s}
  /* BIG bubble */
  .b4{width:85px;height:85px;left:80%;top:70%;animation-duration:18s;animation-delay:1s;background:rgba(255,255,255,0.10)}
  .b5{width:22px;height:22px;left:8%;top:70%;animation-duration:12s;animation-delay:1.5s}
  .b6{width:14px;height:14px;left:55%;top:88%;animation-duration:10s;animation-delay:.5s}
  .b7{width:64px;height:64px;left:12%;top:18%;animation-duration:16s;animation-delay:2.5s;background:rgba(255,255,255,0.12)}
  @keyframes bubbleMove{
    0%{transform:translate(0,0) scale(1);opacity:0}
    10%{opacity:0.9}
    50%{transform:translate(28px,-180px) scale(1.08)}
    90%{opacity:0.7}
    100%{transform:translate(-18px,-420px) scale(1.15);opacity:0}
  }

  .card{
    position:relative;z-index:2;background:#fff;width:100%;max-width:420px;
    padding:36px 32px 26px;border-radius:24px;
    box-shadow:0 18px 40px rgba(124,93,211,0.20);
    animation:pop .6s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .logo{font-size:46px;text-align:center;margin-bottom:6px}
  h2{text-align:center;font-size:27px;color:#5B3FBF;margin-bottom:6px}
  .sub{text-align:center;color:#7a7a9a;font-size:14px;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:600;color:#444;margin:15px 0 7px}
  input{
    width:100%;padding:13px 15px;border:1.5px solid #E0D9FF;
    border-radius:13px;font-size:15px;outline:none;transition:.2s;background:#F8F6FF;
  }
  input:focus{border-color:#8B6FE8;background:#fff;box-shadow:0 0 0 4px rgba(139,111,232,.18)}
  button{
    width:100%;margin-top:26px;padding:14px;border:none;border-radius:13px;
    background:linear-gradient(135deg,#8B6FE8,#B28DFF);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;transition:.2s;
    box-shadow:0 10px 22px rgba(139,111,232,.35);
  }
  button:hover{transform:translateY(-2px)}
  .link{text-align:center;margin-top:20px;font-size:14px;color:#7a7a9a}
  .link a{color:#7C5CD6;font-weight:700;text-decoration:none}
  #msg{text-align:center;margin-top:14px;font-size:14px;min-height:20px}
  .ok{color:#198754}.err{color:#dc3545}

  /* TINY PANDA - just a little bigger than "Password" word */
  .pwd-row{display:flex;align-items:center;gap:8px;margin:15px 0 7px}
  .pwd-row label{margin:0}
  .panda{
    width:34px;height:30px;background:#fff;border:2px solid #222;border-radius:50%;
    position:relative;flex-shrink:0;transition:0.25s;
  }
  .panda::before,.panda::after{
    content:'';position:absolute;width:10px;height:10px;background:#222;
    border-radius:50%;top:-5px;
  }
  .panda::before{left:1px}.panda::after{right:1px}
  .eye{position:absolute;top:10px;width:7px;height:8px;background:#222;border-radius:50%;transition:0.2s}
  .eye.left{left:6px}.eye.right{right:6px}
  .eye::after{content:'';position:absolute;width:2.5px;height:2.5px;background:#fff;border-radius:50%;top:1.5px;left:2px}
  .nose{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:4px;height:3.5px;background:#222;border-radius:50%}
  .mouth{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:8px;height:4px;border-bottom:1.5px solid #222;border-radius:0 0 6px 6px}
  .paw{
    position:absolute;top:6px;width:10px;height:11px;background:#222;border-radius:50%;
    opacity:0;transform:scale(0.5);transition:0.25s;z-index:2;
  }
  .paw.left{left:3px}.paw.right{right:3px}
  .panda.sleep .eye{height:1.5px;top:13px}
  .panda.sleep .eye::after{display:none}
  .panda.sleep .paw{opacity:1;transform:scale(1)}
  .panda-hint{font-size:11px;color:#8B6FE8;font-weight:600;margin-left:2px}
</style>
</head>
<body>
  <span class="float f1">📦</span><span class="float f2">🫙</span>
  <span class="float f3">🔩</span><span class="float f4">🌱</span>
  <span class="float f5">📰</span><span class="float f6">🧴</span>

  <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
  <span class="bubble b4"></span><span class="bubble b5"></span><span class="bubble b6"></span>
  <span class="bubble b7"></span>

<div class="card">
  <div class="logo">♻️</div>
  <h2>Create Account</h2>
  <p class="sub">Join Smart Waste Classifier</p>

  <label>Username</label>
  <input id="username" placeholder="Choose username - e.g. user1 or your_name">

  <label>Email</label>
  <input id="email" type="email" placeholder="Enter email">

  <!-- Tiny Panda + Password in same row -->
  <div class="pwd-row">
    <label for="password">Password</label>
    <div class="panda" id="panda">
      <div class="eye left"></div><div class="eye right"></div>
      <div class="paw left"></div><div class="paw right"></div>
      <div class="nose"></div><div class="mouth"></div>
    </div>
    <span class="panda-hint" id="pandaText">I'm watching 👀</span>
  </div>
  <input id="password" type="password" placeholder="Choose password">

  <button id="btn" onclick="register()">Create Account →</button>
  <p id="msg"></p>
  <p class="link">Already have account? <a href="login.html">Login</a></p>
</div>

<script>
const API = "https://waste-app-m0ez.onrender.com";
const pwd = document.getElementById('password');
const panda = document.getElementById('panda');
const pandaText = document.getElementById('pandaText');
pwd.addEventListener('focus', ()=>{ panda.classList.add('sleep'); pandaText.textContent="I won't look! 🙈"; });
pwd.addEventListener('blur', ()=>{ panda.classList.remove('sleep'); pandaText.textContent="I'm watching 👀"; });
pwd.addEventListener('input', ()=>{ if(pwd.value.length>0){ panda.classList.add('sleep'); pandaText.textContent="Secret! 🤫"; } });
async function register(){
  const btn=document.getElementById('btn');const msg=document.getElementById('msg');
  const username=document.getElementById('username').value.trim();
  const email=document.getElementById('email').value.trim();const password=pwd.value;
  if(!username||!email||!password){msg.textContent="Please fill all fields";msg.className="err";return;}
  btn.disabled=true;btn.textContent="Creating...";msg.textContent="";
  try{
    const res=await fetch(API+"/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,email,password})});
    const data=await res.json();
    if(res.ok){msg.textContent="Account created! Go to Login...";msg.className="ok";setTimeout(()=>window.location.href="login.html",1200);}
    else{msg.textContent=data.error||"Failed to register";msg.className="err";}
  }catch(e){msg.textContent="Backend not running. Please try again.";msg.className="err";}
  btn.disabled=false;btn.textContent="Create Account →";
}
</script>
</body>
</html>
